[project]
name = "medtimeline"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "reportlab==5.0.0", "pillow==11.3.0", "anthropic==0.116.0", "pydantic==2.13.5",
    "pypdf==6.14.2", "pytesseract==0.3.13",
    "Django==6.1.1", "djangorestframework==3.18.1", "djangorestframework-simplejwt==5.5.1",
    "boto3==1.43.108", "psycopg[binary]==3.3.6", "dj-database-url==3.1.2",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "pytest-django==4.14.0", "moto==5.2.3", "ruff==0.13.3", "black==25.9.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
DJANGO_SETTINGS_MODULE = "config.settings"

[tool.ruff]
line-length = 120

[tool.black]
line-length = 120
