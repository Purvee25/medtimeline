name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: medtimeline
          POSTGRES_PASSWORD: medtimeline
          POSTGRES_DB: medtimeline
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U medtimeline" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://medtimeline:medtimeline@localhost:5432/medtimeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: System packages (OCR)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr poppler-utils
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          black --check --exclude '/(\.venv|migrations)/' .
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run --settings=config.settings_test
      - name: Deployment settings check
        run: python manage.py check --deploy --fail-level WARNING
        env:
          DJANGO_SECRET_KEY: ci-only-${{ github.run_id }}-not-a-real-secret-key-but-long-enough
          DJANGO_ALLOWED_HOSTS: example.com
      - name: Test
        run: pytest -q

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
