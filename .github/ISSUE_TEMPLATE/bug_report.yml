name: Bug report
description: Something is broken or behaves unexpectedly.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Use synthetic data only. Never attach real lab reports or personal health information.
        Security issues: report privately via the Security tab instead (see SECURITY.md).
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Backend API, Extraction / OCR, Worker, Frontend, Docker / CI, Docs]
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. docker compose up --build
        2. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      render: text
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: e.g. Docker Compose on macOS, or local Python 3.13 + Node 24
