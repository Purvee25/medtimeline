version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    groups:
      python-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Track the Node LTS line used by the frontend image; move majors deliberately.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directories: ["/", "/frontend"]
    schedule:
      interval: weekly
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Stay on Node LTS (24); odd/current majors aren't LTS. Bump majors deliberately.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
