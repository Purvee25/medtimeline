# Local stack: web UI (:3000), API (:8000), Celery worker, Postgres, Redis and an S3 mock (moto server).
# Usage: cp .env.example .env && docker compose up --build
x-app: &app
  build: .
  env_file: .env
  environment:
    DATABASE_URL: postgres://medtimeline:medtimeline@db:5432/medtimeline
    CELERY_BROKER_URL: redis://redis:6379/0
    AWS_ENDPOINT_URL: http://s3:5000
    AWS_ACCESS_KEY_ID: local
    AWS_SECRET_ACCESS_KEY: local
    # Pre-signed URLs are opened by the browser, which can't resolve the internal "s3" hostname.
    S3_PUBLIC_ENDPOINT_URL: http://localhost:5000
    DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,web
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_healthy }
    s3-init: { condition: service_completed_successfully }

services:
  frontend:
    build: ./frontend
    environment:
      API_UPSTREAM: http://web:8000
      S3_ORIGIN: http://localhost:5000
    ports: ["3000:8080"]
    depends_on: [web]

  web:
    <<: *app
    command: sh -c "python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    ports: ["8000:8000"]

  worker:
    <<: *app
    command: celery -A config worker --loglevel=info --concurrency=2
    healthcheck:
      test: ["CMD", "celery", "-A", "config", "inspect", "ping", "--timeout", "5"]
      interval: 30s

  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: medtimeline
      POSTGRES_USER: medtimeline
      POSTGRES_PASSWORD: medtimeline
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medtimeline"]
      interval: 5s
      retries: 10

  redis:
    image: redis:8.2-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s

  s3:
    image: motoserver/moto:5.2.3
    ports: ["5000:5000"]

  s3-init:
    build: .
    env_file: .env
    environment:
      AWS_ENDPOINT_URL: http://s3:5000
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    depends_on: [s3]
    command: >
      python -c "import boto3, os;
      b = os.environ.get('REPORTS_BUCKET', 'medtimeline-reports-dev');
      r = os.environ.get('AWS_REGION', 'ap-south-1');
      s3 = boto3.client('s3', region_name=r);
      s3.create_bucket(Bucket=b, CreateBucketConfiguration={'LocationConstraint': r});
      s3.put_bucket_cors(Bucket=b, CORSConfiguration={'CORSRules': [{
        'AllowedOrigins': ['http://localhost:3000', 'http://localhost:5173'],
        'AllowedMethods': ['GET', 'POST'], 'AllowedHeaders': ['*'], 'MaxAgeSeconds': 3000}]})"
    restart: on-failure

volumes:
  pgdata:
